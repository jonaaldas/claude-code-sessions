name: Build and deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sessionai-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jonaaldas/claude-code-sessions

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/jonaaldas/claude-code-sessions
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy prebuilt image
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DOKPLOY_WEBHOOK_URL"
          curl --fail --silent --show-error --retry 3 --max-time 60 \
            --request POST "$DOKPLOY_WEBHOOK_URL" --output /dev/null
