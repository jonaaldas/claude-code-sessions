services:
  web:
    image: ghcr.io/jonaaldas/claude-code-sessions:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?required}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      PUBLIC_REPOS: ${PUBLIC_REPOS:?required}
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3005:3000"
    networks:
      - dokploy-network
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
